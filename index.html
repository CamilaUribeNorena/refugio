<!DOCTYPE html>
<html lang="es">
<head>

<meta name="theme-color" content="#2B2325" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Refugio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2E6E1; --bg2:#EAD9D2; --ink:#3A2C2C; --ink2:#7A6262; --line:#DBC6BE;
  --acc:#6E5F86; --acc-soft:#D8CFE3; --sage:#8FA08A; --sage-soft:#D9E0D4; --onacc:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2B2325; --bg2:#352B2E; --ink:#F0E6E1; --ink2:#B9A8A5; --line:#4A3D40;
    --acc:#B9A8D6; --acc-soft:#4A3F5C; --sage:#A5B69F; --sage-soft:#3C4A3A; --onacc:#2B2325;
  }
}
:root[data-theme="dark"]{
  --bg:#2B2325; --bg2:#352B2E; --ink:#F0E6E1; --ink2:#B9A8A5; --line:#4A3D40;
  --acc:#B9A8D6; --acc-soft:#4A3F5C; --sage:#A5B69F; --sage-soft:#3C4A3A; --onacc:#2B2325;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:inherit}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:300;margin:0;line-height:1.15}
h1{font-size:2.3rem}
h2{font-size:1.7rem}
h3{font-size:1.25rem;font-weight:500}
p{margin:0 0 .8rem}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:.8rem .9rem;resize:vertical}
textarea::placeholder{color:var(--ink2)}

#app{max-width:560px;margin:0 auto;padding:1.4rem 1.2rem 6.4rem;min-height:100%}
@keyframes fade{from{opacity:0}to{opacity:1}}
#app{animation:fade .3s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{color:var(--ink2);font-size:.95rem;margin-bottom:.3rem}
.quote{font-family:'Fraunces',Georgia,serif;font-size:1.45rem;font-weight:300;line-height:1.35;margin:1.6rem 0 .4rem;text-wrap:pretty}
.quote-by{color:var(--ink2);font-size:.95rem;margin-bottom:1.8rem}

.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 1rem}
.chip{border:1px solid var(--line);border-radius:999px;padding:.45rem .95rem;background:var(--bg2);transition:background .2s}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.scale{display:flex;gap:.5rem;margin:.6rem 0 1rem}
.scale button{flex:1;aspect-ratio:1;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-size:1.1rem}
.scale button.on{background:var(--sage);border-color:var(--sage);color:var(--onacc)}

.btn{display:inline-block;background:var(--acc);color:var(--onacc);border-radius:999px;padding:.8rem 1.4rem;font-weight:600;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--acc-soft);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--acc);padding:.6rem .4rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.6rem}

.path{display:block;width:100%;text-align:left;background:var(--bg2);border-radius:20px;padding:1.1rem 1.2rem;margin-bottom:.8rem;border:1px solid transparent}
.path:active{border-color:var(--line)}
.path h3{margin-bottom:.2rem}
.path span{color:var(--ink2);font-size:.95rem}
.why{background:var(--sage-soft);border-radius:16px;padding:.9rem 1.1rem;margin:.6rem 0 1rem;font-size:.98rem}

.list{list-style:none;padding:0;margin:1rem 0 0}
.list li{border-top:1px solid var(--line)}
.list li:last-child{border-bottom:1px solid var(--line)}
.list button{width:100%;text-align:left;padding:1rem .2rem;display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.list small{color:var(--ink2);font-size:.9rem;white-space:nowrap}
.list .done{color:var(--sage)}

.step{background:var(--bg2);border-radius:22px;padding:1.4rem 1.3rem;margin-top:1rem}
.step h3{margin-bottom:.6rem}
.dots{display:flex;gap:.4rem;margin:1rem 0 .4rem}
.dots i{width:.55rem;height:.55rem;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}

.breath{display:flex;flex-direction:column;align-items:center;margin:1.2rem 0}
.orb{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--acc-soft),var(--acc));transform:scale(.6);transition:transform 4s ease-in-out;display:grid;place-items:center;color:var(--onacc);font-family:'Fraunces',serif;font-size:1.2rem}
.orb.in{transform:scale(1);transition-duration:4s}
.orb.out{transform:scale(.6);transition-duration:6s}
.breath p{margin-top:1rem;color:var(--ink2)}

.lesson p{font-size:1.02rem}
.lesson .lead{font-family:'Fraunces',Georgia,serif;font-size:1.3rem;font-weight:300;line-height:1.35;margin:.8rem 0 1rem}
.track{margin-top:1.6rem}
.track h3{margin-bottom:.2rem}
.bar{height:6px;border-radius:3px;background:var(--bg2);border:1px solid var(--line);margin:.4rem 0 .2rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage)}

.entry{border-top:1px solid var(--line);padding:.9rem 0}
.entry b{font-weight:600;display:block;margin-bottom:.2rem}
.entry span{color:var(--ink2);font-size:.95rem}
.muted{color:var(--ink2)}
.small{font-size:.9rem}
.week{display:flex;gap:.45rem;margin:.6rem 0 1.4rem}
.week i{flex:1;height:2.2rem;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.week i.l1{background:var(--sage-soft)} .week i.l2{background:var(--sage)} .week i.l3{background:var(--acc-soft)} .week i.l4{background:var(--acc)} .week i.l5{background:var(--acc);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(5.6rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:.5rem 0 calc(.6rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around}
nav button{flex:1;color:var(--ink2);font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.2rem 0}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
.habit{background:var(--bg2);border-radius:20px;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.55rem}
.habit h3{margin:0}
.habit .min{color:var(--ink2);font-size:.92rem;margin:0}
.habits{display:flex;flex-direction:column;gap:.8rem;margin:.8rem 0 1rem}
.tri{display:flex;gap:.45rem;flex-wrap:wrap}
.tri button{border:1px solid var(--line);border-radius:999px;padding:.4rem .85rem;font-size:.92rem;background:var(--bg)}
.tri button.on.full{background:var(--sage);border-color:var(--sage);color:var(--onacc)}
.tri button.on.min{background:var(--sage-soft);border-color:var(--sage)}
.tri button.on.no{background:var(--acc-soft);border-color:var(--acc-soft)}
.days{display:flex;gap:.3rem;align-items:center}
.days i{width:1.35rem;height:.5rem;border-radius:3px;background:var(--bg);border:1px solid var(--line)}
.days i.full{background:var(--sage);border-color:var(--sage)} .days i.min{background:var(--sage-soft);border-color:var(--sage)}
.days small{color:var(--ink2);font-size:.85rem;margin-left:.4rem;font-variant-numeric:tabular-nums}
input.field{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.55rem .75rem}
input.field:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tag{display:inline-block;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:.1rem .55rem}
.caution{border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem;margin:.4rem 0 1rem;font-size:.95rem}
.caution b{display:block;margin-bottom:.2rem}
.toplinks{display:flex;justify-content:flex-end;gap:1.1rem;margin-bottom:.4rem}
.toplinks button{color:var(--acc);font-size:.95rem}
.line{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 0;border-top:1px solid var(--line)}
.line:last-of-type{border-bottom:1px solid var(--line)}
.line div{min-width:0}
.line b{display:block;font-weight:600}
.line span{color:var(--ink2);font-size:.92rem}
.line a{white-space:nowrap;color:var(--onacc);background:var(--acc);border-radius:999px;padding:.5rem 1rem;text-decoration:none;font-weight:600;font-variant-numeric:tabular-nums}
.qr{display:block;width:180px;max-width:100%;border-radius:12px;background:#fff;padding:8px;margin:.6rem 0}
ol.howto{padding-left:1.2rem;margin:.4rem 0 1rem}
ol.howto li{margin-bottom:.3rem}
.timer{display:flex;flex-direction:column;align-items:center;gap:.6rem;background:var(--bg2);border-radius:22px;padding:1.3rem;margin-top:1rem}
.timer .t{font-family:'Fraunces',Georgia,serif;font-size:3rem;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}
.timer p{margin:0;color:var(--ink2);text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}
.grid2>div{min-width:0}
.grid2 h3{font-size:1.02rem;margin:.4rem 0 .3rem}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.back{color:var(--acc);display:inline-flex;align-items:center;gap:.3rem;margin-bottom:.8rem}
</style>

</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
/* ---------- frases ---------- */
const QUOTES=[
 ["No es lo que te pasa, sino cómo respondes a lo que te pasa, lo que está en tus manos.","Epicteto"],
 ["Tienes poder sobre tu mente, no sobre lo que ocurre afuera. Cuando lo entiendes, encuentras fuerza.","Marco Aurelio"],
 ["Sufrimos más en la imaginación que en la realidad.","Séneca"],
 ["Todo lo que somos surge de nuestros pensamientos. Con ellos hacemos el mundo.","Dhammapada"],
 ["No te apresures a juzgar lo que sientes. Míralo, déjalo estar, y verás que también pasa.","Enseñanza budista"],
 ["Lo que hoy es un obstáculo puede ser el camino.","Marco Aurelio"],
 ["El dolor es parte de vivir. El sufrimiento es lo que añadimos cuando peleamos con él.","Enseñanza budista"],
 ["Empieza de una vez a vivir, y cuenta cada día como una vida en sí misma.","Séneca"],
 ["Aceptar no es rendirse. Es dejar de gastar fuerza en pelear con lo que ya está pasando.","Principio DBT"],
 ["Que estés a salvo. Que estés en paz. Que puedas vivir con soltura.","Práctica de metta"],
 ["La mente sabia sabe algo, aunque no pueda explicarlo del todo. Escúchala.","Principio DBT"],
 ["Piensa en la brevedad y en cuánto hay más allá de ti: aquieta lo que te agita.","Marco Aurelio"],
 ["Lo que resistes, persiste. Lo que observas con cariño, se transforma.","Enseñanza budista"],
 ["No pidas que las cosas ocurran como quieres. Quiere que ocurran como ocurren, y andarás en calma.","Epicteto"],
];

/* ---------- emociones y recomendación ---------- */
const EMOS=["Calma","Tristeza","Ansiedad","Rabia","Cansancio","Vergüenza","Vacío","Alegría"];
const SINGLE={Calma:["metta","La calma es buen suelo para sembrar bondad."],Tristeza:["metta","La tristeza suele pedir compañía, no soluciones. Empieza contigo."],Ansiedad:["respirar","La ansiedad vive en la respiración corta. Alárgala y el cuerpo baja."],Rabia:["stop","La rabia va más rápido que tú. Primero frenar, después decidir."],Cansancio:["manos","Cuando no hay energía, que el cuerpo haga el trabajo: postura y respiración."],Vergüenza:["rain","La vergüenza crece en silencio. Reconocerla y nutrirte la encoge."],Vacío:["sentidos","El vacío es la mente lejos. Los sentidos te traen de vuelta."],Alegría:["vista","Míralo desde arriba también cuando es bueno: así se aprende a soltar."]};

/* reglas por combinación: [emociones requeridas, intensidad mínima, práctica, porqué] — la primera que encaje gana */
const COMBOS=[
 [["Rabia","Vergüenza"],1,"hechos","Rabia con vergüenza suele ser vergüenza disfrazada. Antes de actuar, mira qué pasó de verdad."],
 [["Tristeza","Vacío"],1,"metta","Tristeza y vacío juntos piden bondad, no acción. Empieza por ti."],
 [["Ansiedad","Rabia"],1,"stop","Ansiedad y rabia es el cuerpo en alarma. Frenar es lo único que sirve primero."],
 [["Ansiedad","Cansancio"],1,"respirar","Cansancio y alerta a la vez: el cuerpo no puede descansar con la respiración corta."],
 [["Tristeza","Cansancio"],1,"opuesta","Tristeza más cansancio piden encerrarse. La acción opuesta, aunque sea pequeña, rompe el círculo."],
 [["Rabia","Tristeza"],1,"rain","Rabia y tristeza juntas suelen ser una pérdida. Atraviésala con RAIN antes de decidir nada."],
 [["Vergüenza","Vacío"],1,"metta","Vergüenza y vacío es la voz que dice que no vales. Metta es la respuesta directa a esa voz."],
 [["Vergüenza","Ansiedad"],1,"hechos","Vergüenza con ansiedad casi siempre es una historia sobre lo que otros piensan. Verifica los hechos."],
 [["Ansiedad","Vacío"],1,"sentidos","Ansiedad y desconexión: primero volver al cuerpo, después pensar."],
 [["Alegría","Ansiedad"],1,"sabia","Alegría con ansiedad es entusiasmo con miedo. La mente sabia decide qué es real."],
 [["Alegría","Cansancio"],1,"manos","Alegría con agotamiento: deja que el cuerpo lo celebre en quieto."],
 [["Calma","Tristeza"],1,"metta","Calma con tristeza es duelo tranquilo. Acompáñalo con bondad."],
 [["Calma","Rabia"],1,"dearman","Rabia con calma es el momento raro en que se puede pedir algo bien. Aprovéchalo."],
 [["Rabia","Cansancio"],1,"tipp","Rabia sin energía se vuelve irritación. Descarga el cuerpo antes de hablar con nadie."],
];
/* segunda salida: combinaciones en las que, además de la práctica, conviene hablar con alguien */
function riskOf(emos,lvl){
 const has=e=>emos.includes(e);const neg=emos.filter(e=>e!=="Calma"&&e!=="Alegría");
 if(!neg.length||lvl<4)return null;
 if(has("Vacío")&&(has("Vergüenza")||has("Tristeza")))return "Vacío con vergüenza o tristeza, y así de fuerte, es de las combinaciones que no conviene atravesar en soledad.";
 if(has("Rabia"))return "Rabia así de fuerte empuja a actuar rápido. Hablar con alguien mientras baja ayuda a no decidir en el pico.";
 if(neg.length>=3)return "Muchas emociones a la vez y con esta fuerza es mucho para cargar con una sola práctica.";
 if(lvl>=5)return "Con esta intensidad, además de la práctica, puede ayudar escuchar otra voz.";
 return null;
}
function riskCard(msg){return `<div class="caution" style="background:var(--acc-soft);border-color:var(--acc-soft)"><b>Hoy, además, una persona</b>${msg} Puedes llamar o escribir a la Línea Amiga antes, durante o después de la práctica.
 <div class="line" style="border:0;padding-bottom:.2rem"><div><b>Línea Amiga · Medellín</b><span>(604) 444 4448 · 24 horas</span></div><a href="tel:6044444448">Llamar</a></div>
 <div class="line" style="border-bottom:0;padding-top:.6rem"><div><b>Por WhatsApp</b><span>300 723 1123</span></div><a href="https://wa.me/573007231123" target="_blank" rel="noopener">Escribir</a></div>
 <button class="btn ghost" data-go2="ayuda" style="padding:.4rem 0 0">Más líneas y tu contacto de confianza</button></div>`}

function recommend(emos,lvl){
 if(!emos.length)return null;
 if(emos.length>=3&&lvl>=4)return{key:"tipp",why:"Muchas emociones a la vez y fuertes: el cuerpo está desbordado. Primero bajar la intensidad, después entender.",path:"desbordada"};
 if(lvl>=4&&emos.includes("Rabia"))return{key:"ola",why:"Rabia así de fuerte trae impulsos que piden actuar ya. Nada se decide en el pico de la ola: primero dejarla pasar.",path:"arder"};
 if(lvl>=5&&(emos.includes("Rabia")||emos.includes("Ansiedad")))return{key:"stop",why:"A esta intensidad no se decide nada. Solo frenar.",path:"desbordada"};
 for(const [req,min,key,why] of COMBOS){if(lvl>=min&&req.every(e=>emos.includes(e)))return{key,why}}
 const main=emos.find(e=>e!=="Calma")||emos[0];const [key,why]=SINGLE[main];return{key,why};
}

/* ---------- prácticas ---------- */
const PRACTICES={
 respirar:{n:"Respirar 4–6",t:"3 min · DBT / budismo",d:"Inhalar en cuatro tiempos, exhalar en seis. La exhalación larga le avisa al cuerpo que puede bajar la guardia.",breath:true},
 stop:{n:"STOP",t:"1 min · DBT",d:"Para cuando la reacción va más rápido que tú.",steps:[
   ["Stop","Detente. No hagas nada todavía. Ni una palabra, ni un mensaje."],
   ["Toma distancia","Da un paso atrás, literal o mental. Respira una vez hondo."],
   ["Observa","¿Qué está pasando afuera? ¿Qué está pasando adentro? Solo mira, sin arreglar."],
   ["Procede con mente sabia","Ahora sí: ¿qué haría la versión tuya que ya vio pasar esto muchas veces?"]]},
 tipp:{n:"TIPP",t:"5 min · DBT",d:"Para bajar la intensidad del cuerpo cuando la mente no puede sola.",caution:"El agua fría baja el ritmo del corazón y el ejercicio intenso lo sube. Si tienes alguna condición del corazón, presión baja, un trastorno de la conducta alimentaria o estás en embarazo, consulta con tu médico antes y, mientras tanto, usa solo la respiración y la relajación muscular.",steps:[
   ["Temperatura","Agua fría en la cara o hielo en las manos por 30 segundos. El cuerpo baja el ritmo de golpe."],
   ["Intensidad","Un minuto de movimiento fuerte: sentadillas, subir escaleras, saltar. Gasta la energía que sobra."],
   ["Pausa en la respiración","Exhala más largo de lo que inhalas. Cinco ciclos."],
   ["Progresiva","Tensa cada grupo muscular cinco segundos y suelta. De los pies a la cara."]]},
 aceptar:{n:"Aceptación radical",t:"5 min · DBT / budismo",d:"Aceptar no es aprobar. Es dejar de pelear con lo que ya es.",steps:[
   ["Nombra lo que es","Di en voz baja: «Esto es lo que está pasando». Sin adjetivos, sin culpables."],
   ["Nota la pelea","¿Dónde sientes el «no debería ser así»? En la mandíbula, el pecho, las manos."],
   ["Suelta un poco","No tiene que gustarte. Solo deja de empujar contra la pared por un momento."],
   ["Pregunta útil","Dado que esto es así, ¿cuál es el siguiente paso pequeño que sí está en mis manos?"]]},
 control:{n:"Dicotomía del control",t:"4 min · estoicismo",d:"Separar lo que depende de ti de lo que no. Casi todo el peso está en la segunda columna.",write:true},
 rain:{n:"RAIN",t:"5 min · budismo",d:"Para atravesar una emoción fuerte sin ahogarte ni huir.",steps:[
   ["Reconocer","Nombra la emoción: «Esto es miedo». Nombrarla ya le quita fuerza."],
   ["Aceptar","Déjala estar. No la empujes, no la alimentes. Está de visita."],
   ["Investigar","¿Dónde vive en el cuerpo? ¿Qué cree que necesita? Con curiosidad, no con juicio."],
   ["Nutrir","Pon la mano en el pecho. Dile lo que le dirías a alguien que quieres: «Estoy aquí. Esto pasa»."]]},
 hechos:{n:"Verificar los hechos",t:"5 min · DBT",d:"A veces la emoción encaja con lo que pasó. A veces encaja con lo que interpretamos.",steps:[
   ["¿Qué pasó, exactamente?","Solo lo que grabaría una cámara. Sin intenciones ajenas, sin «siempre» ni «nunca»."],
   ["¿Qué me dije?","¿Qué historia se armó sola? ¿Qué supuse sobre lo que otros piensan?"],
   ["¿Qué es lo peor realista?","No lo catastrófico: lo probable. Y si pasa, ¿podría con eso?"],
   ["¿La intensidad encaja?","Si la emoción es más grande que los hechos, considera la acción opuesta."]]},
 opuesta:{n:"Acción opuesta",t:"3 min · DBT",d:"Cuando la emoción no encaja con los hechos, hacer lo contrario de lo que pide la cambia.",steps:[
   ["Miedo pide huir","Acércate un poco. Haz lo que temes, en pequeño, con la espalda derecha."],
   ["Rabia pide atacar","Aléjate con amabilidad. Suaviza la voz. Busca algo entendible en la otra persona."],
   ["Tristeza pide encerrarse","Actívate. Sal, llama, haz una cosa. Sin esperar tener ganas."],
   ["Vergüenza pide esconderse","Cuéntale a alguien de confianza. La luz la disuelve."]]},
 metta:{n:"Metta",t:"5 min · budismo",d:"Bondad amorosa. Empieza por ti; no es egoísmo, es de donde sale todo lo demás.",steps:[

 vista:{n:"Vista desde arriba",t:"4 min · estoicismo",d:"Alejar la cámara hasta que lo que te agobia recupere su tamaño real.",steps:[

 manos:{n:"Manos abiertas, media sonrisa",t:"2 min · DBT",d:"El cuerpo le habla a la mente. Cambia la postura y la emoción escucha.",steps:[

 ola:{n:"Surfear el impulso",t:"10 min · DBT / budismo",d:"Un impulso es una ola: sube, llega a un pico y baja, casi siempre en menos de veinte minutos. No hay que pelear con ella ni obedecerla. Solo quedarse encima mientras pasa.",timer:600,caution:'Si el impulso es hacerte daño, no lo enfrentes solo con la app. <button class="btn ghost" data-go2="ayuda" style="padding:0">Ve a buscar ayuda</button>.',steps:[

/* ---------- lecciones ---------- */
const TRACKS=[
 {k:"budismo",n:"Budismo",s:"Cómo funciona el sufrimiento y cómo se suelta.",lessons:[
  {t:"El dolor y lo que le añadimos",lead:"Vivir duele a veces. Eso no es un fallo tuyo: es la primera verdad.",body:["El Buda no prometió una vida sin dolor. Dijo algo más útil: que el sufrimiento tiene una causa, y que la causa se puede ver. La causa es agarrarse: querer que lo agradable se quede y que lo doloroso se vaya ya.","Cuando peleas contra lo que ya está pasando, añades una segunda capa. El dolor es la flecha; el sufrimiento es la segunda flecha que te lanzas tú al preguntarte por qué a mí, por qué otra vez.","Refugio no quita la primera flecha. Te enseña a no lanzar la segunda."],p:"aceptar"},
  {t:"Todo pasa, también esto",lead:"Impermanencia: nada de lo que sientes ahora va a durar exactamente así.",body:["Míralo en pequeño: una emoción fuerte, sin alimentarla, dura minutos. Lo que la hace durar horas es la historia que le contamos encima.","Esto vale para lo malo y para lo bueno. Por eso el budismo no dice «aférrate a la alegría», dice «disfrútala sabiendo que pasa». Suena triste; en la práctica es lo contrario: se vive más ligero.","Cuando estés en lo peor, prueba a decirte: esto también es impermanente. No como consuelo barato, como dato."],p:"rain"},
  {t:"Los tres tirones",lead:"Casi toda reacción viene de tres lugares: querer, rechazar, o no ver.",body:["El deseo tira hacia algo. La aversión empuja lejos de algo. La confusión es no darte cuenta de que algo te está tirando o empujando. Los textos los llaman los tres venenos; funcionan como reflejos.","La atención plena no los elimina. Solo mete un milímetro de espacio entre el tirón y lo que haces con él. Ese milímetro es toda la libertad que hay, y es suficiente.","Ejercicio de un día: cada vez que notes que quieres algo con urgencia o que algo te repele, nómbralo en silencio. Solo eso."],p:"sentidos"},
  {t:"No eres tus pensamientos",lead:"Un pensamiento es un evento mental. Tú eres quien lo nota.",body:["La mente produce pensamientos como el corazón produce latidos. No los eliges, y no todos son verdad. «Soy un desastre» es un pensamiento; que aparezca no lo convierte en un diagnóstico.","La práctica es sencilla y difícil: cuando aparezca uno, en lugar de discutirlo, ponle una etiqueta. «Juicio». «Recuerdo». «Plan». Y déjalo pasar como un carro que no era el tuyo.","Esto es lo que DBT llama observar y describir. Viene directo del Zen."],p:"respirar"},
  {t:"Bondad, empezando por ti",lead:"Metta no es sentirse bien. Es la intención de que estés bien, repetida hasta que el cuerpo la crea.",body:["La compasión hacia otros suele salir fácil. Hacia uno mismo, menos: hay una voz que dice que eso es debilidad o vanidad. La tradición budista lo pone al revés: si no puedes desearte bien a ti, lo que das a otros sale de un pozo vacío.","Las frases son casi tontas de tan simples. Que esté a salvo. Que esté en paz. Se repiten sin esperar sentir nada. El sentir llega después, o no, y da igual: la intención ya hizo su trabajo.","Empieza siempre por ti. Después alguien querido. Después alguien neutro. Alguien difícil, solo cuando puedas."],p:"metta"},
  {t:"El esfuerzo justo",lead:"Un músico le preguntó al Buda cómo meditar. Él le preguntó cómo afinaba su laúd: ni muy tensa la cuerda, ni muy floja.",body:["El recto esfuerzo es uno de los pasos del óctuple sendero. No es esforzarse al máximo: es el esfuerzo que se puede sostener. Una cuerda muy tensa se rompe; una muy floja no suena.","La disciplina que se rompe en tres días casi siempre estaba demasiado tensa. Tres compromisos pequeños sostenidos un año cambian más que diez heroicos durante una semana.","Cuando notes que te exiges como si fueras otra persona, afloja. Cuando notes que te estás dejando ir, aprieta un poco. Ese ajuste diario es la práctica."],p:"sabia"},
 ]},
 {k:"estoicismo",n:"Estoicismo",s:"Dónde poner la fuerza y dónde no gastarla.",lessons:[
  {t:"Lo que depende de ti",lead:"Hay cosas que están en tus manos y cosas que no. Casi todo el sufrimiento viene de confundirlas.",body:["Epicteto empieza su manual con esto, y todo lo demás cuelga de ahí. Tus juicios, tus intenciones, dónde pones la atención: eso es tuyo. El cuerpo, la reputación, lo que otros hacen, el resultado: eso no.","No es resignación. Es puntería. Si pones toda la fuerza en la primera columna, vives con más poder del que creías; si la pones en la segunda, vives en frustración por diseño.","Cuando algo te agobie, dibuja las dos columnas. Literal, en la app. Casi siempre el peso está en la de la derecha."],p:"control"},
  {t:"No son las cosas, son los juicios",lead:"Lo que te perturba no es lo que pasó, sino lo que crees sobre lo que pasó.",body:["Alguien no contesta un mensaje. El hecho es ese. «No le importo» es un juicio que se añadió solo. La emoción responde al juicio, no al hecho, y por eso dos personas ante lo mismo sienten cosas distintas.","Esto es exactamente lo que la terapia cognitiva redescubrió dos mil años después, y lo que DBT llama verificar los hechos. Los estoicos ya tenían el manual.","La práctica: separar en dos frases. Lo que pasó. Lo que me dije. Y preguntarle a la segunda si tiene pruebas."],p:"hechos"},
  {t:"Las cuatro virtudes",lead:"Sabiduría, justicia, coraje, templanza. No como ideales: como brújula para decidir hoy.",body:["Los estoicos pensaban que lo único realmente bueno es el carácter, porque es lo único que nadie te puede quitar. Todo lo demás (salud, dinero, afecto) es preferible, pero no es tuyo.","Las cuatro son preguntas. ¿Qué es verdad aquí? (sabiduría). ¿Qué es justo con los demás? (justicia). ¿Qué me da miedo hacer y debo hacer igual? (coraje). ¿Dónde estoy de más? (templanza).","Cuando no sepas qué hacer, pásale la decisión por las cuatro. Rara vez salen empatadas."],p:"sabia"},
  {t:"Ensayar lo peor, en calma",lead:"Imaginar lo que podría salir mal no es pesimismo. Es quitarle a la sorpresa su poder.",body:["Séneca lo hacía cada mañana: lo que hoy puede pasar, que no me encuentre sin haberlo pensado. No para angustiarse, sino para llegar con preparación y, a menudo, para descubrir que lo temido es más manejable de lo que la ansiedad pintaba.","Lo hacían también con lo que tenían: mirar a las personas queridas sabiendo que no son eternas. Suena duro; produce lo contrario, gratitud por el hoy.","La diferencia con la rumiación es la calma. Se hace en quietud, con tiempo, una sola vez. No en bucle a las tres de la mañana."],p:"premeditatio"},
  {t:"La ira y la demora",lead:"Séneca escribió un libro entero sobre la ira y llegó a una conclusión práctica: su mejor remedio es esperar.",body:["Para Séneca la ira es una locura breve: mientras dura no se ve nada más, y lo que se hace bajo ella cuesta reparar durante años. No proponía no sentirla, sino no darle las manos.","Su consejo era casi físico: cuando llegue, no hagas nada todavía. Deja pasar el primer golpe. La ira tiene prisa porque sabe que con tiempo se debilita.","Hoy se sabe lo mismo por otro lado: la activación del cuerpo baja en minutos si no se alimenta. Esperar no es debilidad. Es negarse a que el peor momento decida por ti."],p:"ola"},
  {t:"La intención de la mañana",lead:"Marco Aurelio empezaba el día recordándose qué le tocaba hacer y qué tipo de gente se iba a encontrar. Así nada lo tomaba por sorpresa.",body:["Las Meditaciones son, en buena parte, notas de un hombre organizando su mente antes de trabajar. No escribía metas: escribía a qué volver cuando el día se torciera.","La atención estoica (prosoche) es eso: saber en cada momento qué está en tus manos ahora. Una sola intención escrita en la mañana le da a la mente un lugar al que regresar.","Que sea corta y que dependa de ti. «Que me salga bien la reunión» no depende de ti. «Llegar con todo listo y escuchar antes de responder» sí."],p:"control"},
  {t:"La revisión de la noche",lead:"Antes de dormir, Séneca se preguntaba: ¿qué hice hoy? ¿qué mal curé? ¿en qué soy mejor?",body:["No es un juicio sino un inventario amable. Lo que estuvo en mis manos y cómo lo usé. Lo que no estuvo y aun así cargué. Lo que hubo de bueno, aunque fuera pequeño.","La regla es no castigarse: «te perdono por hoy, pero mañana mira eso». Con ese tono, la revisión se vuelve un lugar al que quieres volver en lugar de una lista de fallos.","Es la pantalla Noche de esta app. Tres preguntas, respuestas cortas."],p:"vista"},
 ]},
 {k:"dbt",n:"DBT",s:"Habilidades concretas para emociones que llegan muy fuerte.",lessons:[
  {t:"Aceptar y cambiar, a la vez",lead:"La dialéctica es sostener dos cosas verdaderas que parecen contrarias: estoy haciendo lo mejor que puedo, y necesito hacerlo mejor.",body:["Marsha Linehan diseñó DBT para personas cuyas emociones llegan más rápido, más alto y bajan más lento. Descubrió que solo empujar al cambio las hacía sentir invalidadas, y que solo aceptar las dejaba atascadas. La respuesta fue las dos cosas.","De ahí vienen las cuatro áreas: atención plena (del Zen), tolerancia al malestar y aceptación radical (también del Zen), regulación emocional y efectividad interpersonal (de la terapia conductual).","Cuando sientas que te partes en dos, sospecha que hay una dialéctica: dos verdades peleando por ser la única."],p:"aceptar"},
  {t:"Mente sabia",lead:"Hay una mente que solo piensa y una que solo siente. La sabia es donde se encuentran.",body:["La mente racional sabe los datos pero no sabe qué importa. La emocional sabe qué importa pero exagera los datos. Ninguna decide bien sola.","La mente sabia no es un compromiso tibio entre las dos: es una tercera cosa, una certeza tranquila que se siente en el cuerpo, muchas veces en el pecho o el estómago. Todo el mundo la ha sentido alguna vez.","La práctica es preguntar y esperar. No forzar la respuesta. Si viene con urgencia y ruido, era la emocional disfrazada."],p:"sabia"},
  {t:"Observar, describir, participar",lead:"Tres formas de estar presente, y tres formas de hacerlo: sin juzgar, una cosa a la vez, con eficacia.",body:["Observar es notar sin palabras. Describir es ponerle palabras solo a lo que se observa: «tensión en la mandíbula», no «estoy fatal». Participar es meterse del todo en lo que se hace, sin narrarlo.","Sin juzgar no es no evaluar: es cambiar «esto es horrible» por «esto es doloroso y no lo quiero». El juicio añade la segunda flecha del budismo.","Una cosa a la vez, y con eficacia: hacer lo que funciona, no lo que tendría razón."],p:"sentidos"},
  {t:"Las emociones tienen función",lead:"Ninguna emoción es un error. Cada una lleva un mensaje y un impulso; a veces el impulso ya no sirve.",body:["El miedo protege y pide huir. La rabia defiende y pide atacar. La tristeza señala pérdida y pide recogerse. La vergüenza cuida el lugar en el grupo y pide esconderse. Todo eso fue útil alguna vez.","Regular no es apagar. Es preguntar si el mensaje encaja con los hechos y si el impulso ayuda hoy. Si encaja, se escucha. Si no encaja, se hace lo opuesto, y la emoción baja porque la acción le contradice.","Por eso Refugio te pregunta con qué emociones llegas: la combinación dice mucho de cuál práctica te va a servir."],p:"opuesta"},
  {t:"Sobrevivir la crisis sin empeorarla",lead:"Hay momentos en que no se puede resolver nada. El objetivo es solo no hacer algo de lo que te arrepientas.",body:["Tolerancia al malestar es el conjunto de habilidades para esos momentos. No son elegantes: agua fría, ejercicio intenso, respiración larga, distraerse a propósito. Bajan la activación del cuerpo cuando la mente no puede.","La lógica es fisiológica: el cuerpo no puede sostener una alarma a tope más de unos minutos si dejas de alimentarla. TIPP y STOP le dan esos minutos.","Después, cuando baje, sí se piensa. Nunca antes."],p:"tipp"},
  {t:"Pedir sin romper",lead:"Se puede pedir lo que necesitas, cuidar la relación y cuidarte a ti. Las tres cosas, con orden.",body:["Antes de hablar, decide qué importa más esta vez: conseguir lo que pides, conservar la relación, o conservar tu respeto propio. Casi nunca se puede maximizar las tres; saber cuál va primero evita salir de la conversación con la sensación de haberte traicionado.","DEAR MAN es la habilidad para el objetivo. Se suma la validación para la relación (mostrar que entiendes al otro) y la honestidad sin disculpas de más para el respeto propio.","Se ensaya. En voz alta, a solas, antes. Suena raro y funciona."],p:"dearman"},
  {t:"El impulso es una ola",lead:"Querer que todo arda no te convierte en alguien destructivo. Es una emoción con un impulso muy fuerte, y los impulsos pasan.",body:["En el trastorno límite la impulsividad no es falta de carácter: las emociones suben más rápido y más alto, y el impulso llega antes que la pausa. DBT no pide que no lo sientas. Pide que entre el impulso y la acción haya un espacio, aunque sea de minutos.","Tres herramientas para ese espacio. STOP frena el cuerpo. Surfear el impulso, que viene de la atención plena budista, te enseña a quedarte encima de la ola sin obedecerla. Pros y contras le recuerda a la mente lo que en el pico no puede ver: las consecuencias de mañana.","Una regla simple ayuda mucho: nada irreversible en caliente. Ningún mensaje que no se pueda borrar, ninguna renuncia, ninguna compra grande, nada que rompa algo. Si mañana sigues queriéndolo, mañana lo decides."],p:"ola"},
  {t:"Disciplina sin castigo",lead:"La disciplina no se construye con fuerza de voluntad. Se construye con cosas pequeñas que se repiten, y con volver después de fallar.",body:["DBT tiene una habilidad que se llama construir dominio: hacer cada día una cosa un poco difícil, a propósito, para que el cuerpo acumule pruebas de que puedes. No tiene que ser grande. Tiene que ser diaria.","Con emociones intensas aparece el todo o nada: si no lo hice perfecto, no cuenta, y si ayer fallé, ya se perdió. Por eso Rumbo no tiene rachas. Cada compromiso tiene una versión mínima para los días malos, y lo que se cuenta es cuántas veces volviste.","La base física también es disciplina: dormir parecido cada noche, comer a horas, moverse, cuidar el cuerpo cuando está enfermo y evitar lo que altera el ánimo. DBT lo llama PLEASE. Una mente desordenada casi siempre viene de un cuerpo sin rutina.","Cuando no haya ganas, haz la versión mínima igual. Eso es acción opuesta: la falta de ganas pide quedarse quieta, y moverse un poco la desarma."],p:"opuesta"},
 ]},
];

const pad=n=>String(n).padStart(2,"0");

const dayKey=off=>{const d=new Date(Date.now()-off*864e5);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const nowT=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const fmt=d=>new Date(d+"T12:00").toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"short"});

const HABIT_EX=[

const habits=()=>store.get("habits",null)||HABIT_EX;
const ticks=()=>store.get("ticks",{});
function setTick(day,id,v){const t=ticks();t[day]=t[day]||{};if(t[day][id]===v)delete t[day][id];else t[day][id]=v;store.set("ticks",t)}
/* veces que volvió: día cumplido (completo o mínimo) después de uno sin cumplir */
function habitStats(id){
 const t=ticks();let week=0,back=0;
 for(let i=0;i<7;i++){const v=(t[dayKey(i)]||{})[id];if(v==="full"||v==="min")week++}
 const days=Object.keys(t).sort();if(!days.length)return{week,back};
 const ok=d=>{const v=(t[d]||{})[id];return v==="full"||v==="min"};
 const start=new Date(days[0]+"T12:00");let prevOk=null;
 for(let d=new Date(start);d<=new Date();d=new Date(d.getTime()+864e5)){
  const k=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());const o=ok(k);
  if(o&&prevOk===false)back++;prevOk=o;
 }
 return{week,back};
}
function missedYesterday(){const t=ticks();const y=t[dayKey(1)]||{};const hs=habits();
 return Object.keys(t).length>0&&hs.some(h=>y[h.id]!=="full"&&y[h.id]!=="min")}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

 const v=[0,1,2,3,4].map(g);if(!v.some(Boolean))return;

/* al cerrar una práctica o un camino: pasa a la pantalla del después */

 pending={key,emos:t?[...t.emos]:[],before:t?t.lvl:null,after:null};
 go("despues");
}
function saveSession(){

 s.push({d:todayKey(),t:nowT(),key:pending.key,emos:[...pending.emos],before:pending.before,after:pending.after});

/* todos los registros en un CSV largo (una fila por evento) */
async function exportCSV(){
 const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
 const rows=[];
 store.get("checkins",[]).forEach(c=>rows.push(["llegada",c.d,c.t||"",c.emos.join("|"),c.lvl,"","","",c.note||"","",""]));
 store.get("sessions",[]).forEach(s=>rows.push(["practica",s.d,s.t,s.emos.join("|"),"",label(s.key),s.before,s.after,"","",""]));
 store.get("proscontras",[]).forEach(c=>rows.push(["pros_contras",c.d,c.t,"","",c.i,"","","Actuar: pros "+c.p1+" / contras "+c.c1,"Esperar: pros "+c.p2+" / contras "+c.c2,""]));
 store.get("control",[]).forEach(c=>rows.push(["control",c.d,c.t,"","","Dicotomía del control","","",c.a,c.b,""]));
 Object.entries(store.get("intents",{})).forEach(([d,v])=>rows.push(["intencion",d,"","","","","","",v,"",""]));
 {const hs=habits();Object.entries(ticks()).forEach(([d,o])=>Object.entries(o).forEach(([id,v])=>{const h=hs.find(x=>x.id===id);rows.push(["compromiso",d,"","","",h?h.n:id,"","",v==="full"?"hecho":v==="min"?"minimo":"no","",""])}))}
 store.get("nights",[]).forEach(n=>rows.push(["noche",n.d,"","","","","","",n.a,n.b,n.c]));
 if(!rows.length)return toast("Todavía no hay registros");
 rows.sort((x,y)=>(x[1]+" "+x[2]).localeCompare(y[1]+" "+y[2]));
 rows.unshift(["tipo","fecha","hora","emociones","intensidad","practica","antes","despues","texto1","texto2","texto3"]);
 const csv="﻿"+rows.map(r=>r.map(q).join(",")).join("\n");
 const name="refugio-"+todayKey()+".csv";
 /* dentro del visor de claude.ai la descarga pasa por el visor */
 if(window.claude&&typeof window.claude.use==="function"){
  let dl=null;try{dl=await window.claude.use("downloads")}catch(e){}
  if(dl){try{await dl.save({filename:name,data:csv});toast("Guardado")}catch(e){if(!(e&&e.code==="declined"))toast("No se pudo descargar aquí")}return}
 }
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
 try{
  const f=new File([blob],name,{type:"text/csv"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Refugio"});return}
 }catch(e){if(e&&e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- copia de seguridad ---------- */
const KEYS=["proscontras","checkins","sessions","control","nights","lessons","habits","ticks","intents"];
async function shareOrDownload(name,text,type){
 const blob=new Blob([text],{type});
 try{const f=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Refugio"});return}}catch(e){if(e&&e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function backup(){const o={app:"refugio",v:1,fecha:todayKey()};KEYS.forEach(k=>{const v=store.get(k,null);if(v!=null)o[k]=v});
 shareOrDownload("refugio-copia-"+todayKey()+".json",JSON.stringify(o),"application/json")}
function restore(file){if(!file)return;const r=new FileReader();r.onload=()=>{
 try{const o=JSON.parse(r.result);if(o.app!=="refugio")throw 0;KEYS.forEach(k=>{if(o[k]!=null)store.set(k,o[k])});toast("Copia restaurada");go("hoy")}
 catch(e){toast("Ese archivo no es una copia de Refugio")}};r.readAsText(file)}

/* ---------- respiración ---------- */
let breathTimer=null;
/* temporizador de espera (sigue corriendo entre pasos) */
let timerEnd=null,timerTick=null;
const fmtT=sec=>Math.floor(sec/60)+":"+pad(sec%60);
const timerLeft=total=>timerEnd?Math.max(0,Math.round((timerEnd-Date.now())/1000)):total;
function startTimer(total){timerEnd=Date.now()+total*1000;runTimer();render()}
function runTimer(){clearInterval(timerTick);timerTick=setInterval(()=>{const el=$("#tmr");const left=timerLeft(0);
 if(el)el.textContent=fmtT(left);
 if(left<=0){clearInterval(timerTick);timerEnd=null;if($("#tmrl"))$("#tmrl").textContent="Pasaron diez minutos. ¿Qué número tiene ahora el impulso?";const b=$("#tstart");if(b){b.textContent="Otra vez";}try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}},500)}
function stopTimer(){clearInterval(timerTick);timerEnd=null}
function startBreath(){
 const orb=$("#orb"),lbl=$("#blbl");if(!orb)return;
 let phase="in";const cyc=()=>{
  if(!$("#orb"))return stopBreath();
  if(phase==="in"){orb.className="orb in";orb.textContent="inhala";lbl.textContent="cuatro tiempos";breathTimer=setTimeout(cyc,4000);phase="out"}
  else{orb.className="orb out";orb.textContent="exhala";lbl.textContent="seis tiempos";breathTimer=setTimeout(cyc,6000);phase="in"}
 };cyc();$("#bstart").textContent="Detener";$("#bstart").onclick=stopBreath;
}
function stopBreath(){if(breathTimer){clearTimeout(breathTimer);breathTimer=null}
 const b=$("#bstart");if(b){b.textContent="Empezar";b.onclick=startBreath;$("#orb").className="orb";$("#orb").textContent="";$("#blbl").textContent="Cuando quieras"}}

}

function vAcerca(){
 const first=!store.get("aviso",false);
 return `${first?"":`<button class="back" data-go="hoy">‹ Volver</button>`}<p class="eyebrow">${first?"Te damos la bienvenida":"Acerca de"}</p><h1>Refugio</h1>
 <p style="margin-top:1rem">Una app para practicar habilidades de DBT, estoicismo y budismo: notar cómo llegas, bajar la intensidad cuando todo va muy rápido, sostener compromisos pequeños y revisar el día antes de dormir.</p>
 <div class="caution"><b>Lo que Refugio no es</b>No es un tratamiento, no hace diagnósticos y no reemplaza a un psicólogo, psiquiatra o terapeuta de DBT. Sirve para practicar entre sesiones o para empezar a conocer estas herramientas. Si estás en crisis, ve a <button class="btn ghost" data-go2="ayuda" style="padding:0">Cuándo buscar ayuda</button>.</div>
 <h3 style="margin-top:1.2rem">Tu privacidad</h3>
 <p>Lo que escribes y marcas se guarda solo en este teléfono. No hay cuentas, no hay servidores que reciban tus datos y nadie, ni quien hizo la app, puede verlos. Por eso mismo, si borras la app se borran tus registros: guarda una copia de seguridad desde Noche de vez en cuando.</p>
 ${first?`<div class="row" style="margin:1rem 0 1.6rem"><button class="btn" id="aceptoAviso">Entendido, empezar</button></div>`:""}
 <h3 style="margin-top:1.2rem">Instalarla en el teléfono</h3>
 <p class="muted small" style="margin:.2rem 0 0">iPhone, en Safari:</p>
 <ol class="howto"><li>Abre el enlace de Refugio en Safari.</li><li>Toca Compartir y luego «Agregar a pantalla de inicio».</li><li>Ábrela siempre desde el ícono.</li></ol>
 <p class="muted small" style="margin:.2rem 0 0">Android, en Chrome:</p>
 <ol class="howto"><li>Abre el enlace de Refugio en Chrome.</li><li>Toca «Instalar app» cuando aparezca, o el menú ⋮ y «Instalar app».</li><li>La encuentras con tus demás aplicaciones.</li></ol>
 <h3 style="margin-top:1.2rem">Compartir Refugio</h3>
 <p class="small" style="margin:.2rem 0 0;word-break:break-all">${APP_URL}</p>
 <img class="qr" src="qr.png" alt="Código QR con el enlace de Refugio">
 <div class="row"><button class="btn soft" id="shareLink">Compartir enlace</button></div>
 <h3 style="margin-top:1.6rem">De dónde viene</h3>
 <p class="small">Las habilidades de DBT vienen del trabajo de Marsha Linehan. Las ideas estoicas, de Epicteto, Séneca y Marco Aurelio. Las prácticas budistas, de la tradición de atención plena y metta. Los textos de la app son adaptaciones breves, no citas textuales de manuales clínicos.</p>
 ${first?"":`<div class="row" style="margin-top:1rem"><button class="btn ghost" data-go2="ayuda">Cuándo buscar ayuda</button></div>`}`;
}

function vPract(){
 if(sub){
  const p=PRACTICES[sub];
  return `<button class="back" data-go="practicas">‹ Prácticas</button><p class="eyebrow">${p.t}</p><h2>${p.n}</h2>${practBody(p)}
  <div class="row" style="margin-top:1.2rem"><button class="btn" id="finishP">Listo</button></div>`;
 }
 return `<p class="eyebrow">Biblioteca</p><h1>Prácticas</h1><p class="muted">Ninguna toma más de cinco minutos. Elige por lo que necesites, no por lo que «deberías».</p>
 <ul class="list">${Object.entries(PRACTICES).map(([k,p])=>`<li><button data-pract="${k}"><span>${p.n}</span><small>${p.t}</small></button></li>`).join("")}</ul>`;
}

function vDespues(){
 if(!pending)return vHoy();
 const isPath=!PRACTICES[pending.key];
 const scale=(k,v)=>`<div class="scale">${[1,2,3,4,5].map(n=>`<button class="${v===n?"on":""}" data-${k}="${n}">${n}</button>`).join("")}</div>`;
 return `<p class="eyebrow">${isPath?"Después del camino «"+esc(label(pending.key))+"»":"Después de "+esc(label(pending.key))}</p><h1>¿Cómo estás ahora?</h1>
 <p class="muted">No es una calificación. Es para saber, con el tiempo, qué te sirve a ti.</p>
 ${pending.before==null&&!pending.emos.length?`<h3 style="margin-top:1rem">¿Con qué llegaste? <span class="muted small" style="font-weight:400">(opcional)</span></h3>
 <div class="chips">${EMOS.map(e=>`<button class="chip ${pending.emos.includes(e)?"on":""}" data-emo2="${e}">${e}</button>`).join("")}</div>`:""}
 <h3 style="margin-top:1rem">Antes de la práctica</h3>${scale("b",pending.before)}
 <h3 style="margin-top:.6rem">Ahora</h3>${scale("a",pending.after)}
 <div class="row"><button class="btn" id="saveAfter">Guardar</button><button class="btn ghost" id="skipAfter">Ahora no</button></div>`;
}

function vAprender(){
 const read=store.get("lessons",{});
 if(sub!==null&&sub2!==null){
  const tr=TRACKS.find(t=>t.k===sub);const L=tr.lessons[sub2];const id=sub+":"+sub2;const p=PRACTICES[L.p];
  const next=sub2<tr.lessons.length-1;
  return `<button class="back" data-go="aprender">‹ Aprender</button><p class="eyebrow">${tr.n} · ${sub2+1} de ${tr.lessons.length}</p><h2>${L.t}</h2>
  <div class="lesson"><p class="lead">${L.lead}</p>${L.body.map(b=>`<p>${b}</p>`).join("")}</div>
  <p class="muted" style="margin-top:1.2rem">Dónde se vive esto:</p>
  <button class="path" data-pract="${L.p}"><h3>${p.n}</h3><span>${p.t}</span></button>
  <div class="row"><button class="btn soft" data-read="${id}">${read[id]?"Marcar como no leída":"Ya la leí"}</button>
  ${next?`<button class="btn ghost" data-lesson="${sub}:${sub2+1}">Siguiente</button>`:""}</div>`;
 }
 return `<p class="eyebrow">Las tres fuentes</p><h1>Aprender</h1><p class="muted">Lecciones de dos minutos. Cada una termina en la práctica donde se vuelve real. Sin orden obligatorio.</p>
 ${TRACKS.map(tr=>{const n=tr.lessons.filter((_,i)=>read[tr.k+":"+i]).length;
  return `<div class="track"><h3>${tr.n}</h3><p class="muted" style="margin:0">${tr.s}</p><div class="bar"><i style="width:${n/tr.lessons.length*100}%"></i></div><p class="muted small">${n} de ${tr.lessons.length}</p>
  <ul class="list" style="margin-top:.2rem">${tr.lessons.map((L,i)=>`<li><button data-lesson="${tr.k}:${i}"><span>${L.t}</span><small class="${read[tr.k+":"+i]?"done":""}">${read[tr.k+":"+i]?"leída":"2 min"}</small></button></li>`).join("")}</ul></div>`}).join("")}`;
}

function vNoche(){
 const nights=store.get("nights",[]);const t=nights.find(n=>n.d===todayKey());
 const hist=nights.filter(n=>n.d!==todayKey()).slice(-7).reverse().map(n=>`<div class="entry"><b>${fmt(n.d)}</b>
   ${n.a?`<span>En mis manos: </span>${esc(n.a)}<br>`:""}${n.b?`<span>Fuera: </span>${esc(n.b)}<br>`:""}${n.c?`<span>Agradezco: </span>${esc(n.c)}`:""}</div>`).join("");
 return `<p class="eyebrow">Revisión de la noche</p><h1>Antes de dormir</h1>
 <p class="muted">Tres preguntas. Respuestas cortas valen. No es un examen.</p>
 ${(()=>{const hs=habits(),td=ticks()[todayKey()]||{},it=(store.get("intents",{}))[todayKey()];const n=hs.filter(h=>td[h.id]==="full"||td[h.id]==="min").length;
  return `<div class="why">${it?`Tu intención de hoy: «${esc(it)}»<br>`:""}Compromisos: ${n} de ${hs.length}. ${n?"Eso cuenta.":"Mañana se vuelve. Hoy no se arregla nada más."}</div>`})()}
 <h3 style="margin-top:1.2rem">¿Qué estuvo en mis manos hoy?</h3><textarea id="n1" rows="2">${t?esc(t.a):""}</textarea>
 <h3 style="margin-top:1rem">¿Qué no lo estuvo, y aun así cargué?</h3><textarea id="n2" rows="2">${t?esc(t.b):""}</textarea>
 <h3 style="margin-top:1rem">¿Qué agradezco, aunque sea pequeño?</h3><textarea id="n3" rows="2">${t?esc(t.c):""}</textarea>
 <div class="row"><button class="btn" id="saveNight">${t?"Actualizar":"Guardar y descansar"}</button></div>
 ${hist?`<h3 style="margin-top:2rem">Noches anteriores</h3>${hist}`:`<p class="muted" style="margin-top:2rem">Aquí irán apareciendo tus noches. Sin prisa.</p>`}
 <div class="row" style="margin-top:2.2rem"><button class="btn soft" id="exportCsv">Descargar mis registros (CSV)</button></div>
 <div class="row"><button class="btn ghost" id="backup">Guardar copia de seguridad</button><label class="btn ghost" for="restoreFile" style="cursor:pointer">Restaurar copia</label><input type="file" id="restoreFile" accept=".json,application/json" hidden></div>
 <p class="muted small" style="margin-top:.6rem">Llegadas, prácticas con su antes y después, dicotomías, intenciones, compromisos y noches. Todo vive solo en este teléfono; descárgalo de vez en cuando. La copia de seguridad sirve para pasar todo a otro teléfono.</p>`;
}

/* ---------- eventos ---------- */
function bind(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{saveControl();go(b.dataset.go)});
 document.querySelectorAll("[data-emo]").forEach(b=>b.onclick=()=>{const e=b.dataset.emo;sel.emos=sel.emos.includes(e)?sel.emos.filter(x=>x!==e):[...sel.emos,e];render()});
 document.querySelectorAll("[data-emo2]").forEach(b=>b.onclick=()=>{const e=b.dataset.emo2;pending.emos=pending.emos.includes(e)?pending.emos.filter(x=>x!==e):[...pending.emos,e];render()});
 document.querySelectorAll("[data-lvl]").forEach(b=>b.onclick=()=>{sel.lvl=+b.dataset.lvl;render()});
 document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{pending.before=+b.dataset.b;render()});
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{pending.after=+b.dataset.a;render()});
 document.querySelectorAll("[data-path]").forEach(b=>b.onclick=()=>go("ahora",b.dataset.path));
 document.querySelectorAll("[data-pract]").forEach(b=>b.onclick=()=>go("practicas",b.dataset.pract));
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const t=store.get("checkins",[]).find(c=>c.d===todayKey());if(t){sel={emos:[...t.emos],lvl:t.lvl}}sub="edit";render()});
 document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.lesson.split(":");go("aprender",k,+i)});
 document.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{const r=store.get("lessons",{});r[b.dataset.read]=!r[b.dataset.read];store.set("lessons",r);toast(r[b.dataset.read]?"Leída":"Sin marcar");render()});
 document.querySelectorAll("[data-go2]").forEach(b=>b.onclick=()=>{const from=view==="ayuda"?"hoy":view;saveControl();go(b.dataset.go2,from)});
 const ac=$("#aceptoAviso");if(ac)ac.onclick=()=>{store.set("aviso",true);go("hoy")};
 const sct=$("#saveContact");if(sct)sct.onclick=()=>{store.set("contacto",{n:$("#cn").value.trim(),t:$("#ct").value.trim()});toast("Guardado");render()};
 const sl=$("#shareLink");if(sl)sl.onclick=async()=>{
  try{if(navigator.share){await navigator.share({title:"Refugio",text:"Una app para practicar DBT, estoicismo y budismo.",url:APP_URL});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(APP_URL);toast("Enlace copiado")}catch(e){toast("Copia el enlace de arriba")}};
 document.querySelectorAll("[data-tick]").forEach(b=>b.onclick=()=>{const [id,v]=b.dataset.tick.split(":");setTick(todayKey(),id,v);render()});
 document.querySelectorAll("[data-hedit]").forEach(b=>b.onclick=()=>go("rumbo","edit"));
 const si=$("#saveIntent");if(si)si.onclick=()=>{const it=store.get("intents",{});const v=$("#intent").value.trim();if(v)it[todayKey()]=v;else delete it[todayKey()];store.set("intents",it);toast("Guardado");render()};
 const sh=$("#saveHabits");if(sh)sh.onclick=()=>{const old=habits();const out=[];
  for(let i=0;i<3;i++){const n=$("#hn"+i).value.trim(),m=$("#hm"+i).value.trim();const o=old[i];
   if(n)out.push({id:"h"+(i+1),n,m:m||"Hacerlo un poco"});else if(o&&o.ex&&!m)out.push({id:o.id,n:o.n,m:o.m})}
  if(!out.length)return toast("Escribe al menos un compromiso");
  store.set("habits",out.map(h=>({id:h.id,n:h.n,m:h.m})));toast("Guardado");go("rumbo")};
 const sc=$("#saveCheck");if(sc)sc.onclick=()=>{
  if(!sel.emos.length||!sel.lvl)return toast("Marca al menos una emoción y su fuerza");
  const c=store.get("checkins",[]).filter(x=>x.d!==todayKey());
  c.push({d:todayKey(),t:nowT(),emos:[...sel.emos],lvl:sel.lvl,note:$("#note").value.trim()});store.set("checkins",c);
  sel={emos:[],lvl:null};sub=null;toast("Guardado");render();window.scrollTo(0,0);
 };
 const sn=$("#saveNight");if(sn)sn.onclick=()=>{
  const n=store.get("nights",[]).filter(x=>x.d!==todayKey());
  n.push({d:todayKey(),a:$("#n1").value.trim(),b:$("#n2").value.trim(),c:$("#n3").value.trim()});store.set("nights",n);
  toast("Guardado. Descansa.");render();
 };
 const sa=$("#saveAfter");if(sa)sa.onclick=()=>{if(pending.after==null)return toast("Marca cómo estás ahora");saveSession();pending=null;toast("Guardado");go("hoy")};
 const sk=$("#skipAfter");if(sk)sk.onclick=()=>{pending.after=null;saveSession();pending=null;go("hoy")};
 const fp=$("#finishP");if(fp)fp.onclick=()=>finishPractice(sub);
 const fpath=$("#finishPath");if(fpath)fpath.onclick=()=>finishPractice(sub);
 const np=$("#nextPath");if(np)np.onclick=()=>{saveControl();stopTimer();stepIdx++;pStep=0;stopBreath();render();window.scrollTo(0,0)};
 const pn=$("#pNext");if(pn)pn.onclick=()=>{pStep++;render()};
 const pp=$("#pPrev");if(pp)pp.onclick=()=>{pStep--;render()};
 const bs=$("#bstart");if(bs)bs.onclick=startBreath;
 const ts=$("#tstart");if(ts)ts.onclick=()=>{if(timerEnd){stopTimer();render()}else{const k=view==="ahora"?PATHS.find(x=>x.k===sub).seq[stepIdx]:sub;startTimer(PRACTICES[k].timer)}};
 const ex=$("#exportCsv");if(ex)ex.onclick=exportCSV;
 const bk=$("#backup");if(bk)bk.onclick=backup;
 const rf=$("#restoreFile");if(rf)rf.onchange=()=>restore(rf.files[0]);
}
/* migración de registros antiguos con una sola emoción */
(()=>{const c=store.get("checkins",[]);let ch=false;c.forEach(x=>{if(x.emo&&!x.emos){x.emos=[x.emo];delete x.emo;ch=true}});if(ch)store.set("checkins",c)})();
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body>
</html>
